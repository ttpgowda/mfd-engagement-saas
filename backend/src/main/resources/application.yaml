spring:
  main:
    allow-bean-definition-overriding: true
    lazy-initialization: true
  datasource:
    url: jdbc:postgresql://${DATASOURCE_URL:localhost}/${DATASOURCE_DATABASE:amfi_db}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:none}
    password: ${MAIL_PASSWORD:none}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: smtpout.secureserver.net
            enable: false
            protocols: TLSv1.2
          from: ${MAIL_FROM:noreply@localhost}
# App settings for Tenant resolution
app:
  domain: ${APP_DOMAIN:localhost}

